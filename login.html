<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Ben 10</title>
    <link rel="stylesheet" href="./css/home.css">
    <link rel="stylesheet" href="./css/login.css">
	<link rel="stylesheet" href="./js/login.js">
</head>
<body>
    <header>
        <nav class="navbar">
            <img src="https://upload.wikimedia.org/wikipedia/commons/6/6f/Ben_10_reboot_logo.png" alt="" id="logo">
            <div class="nav-items">
				<ul>
					<li><a href="index.html" class="links">Início</a></li>
					<li><a href="comunidade.html" class="links">Comunidade</a></li>
					<li><a href="sobrenos.html" class="links">Sobre nós</a></li>
					<li><a href="login.html" class="links">Login</a></li>
				</ul>
			</div>
        </nav>
    </header>
    <main>
        <div class="login-container">
            <div class="login-box">
                <h1>Login</h1>
                <p class="subtitle">Acesse o Universo Ben 10</p>
                <form id="loginForm">
                    <div class="input-group">
                        <label for="username">Usuário</label>
                        <input type="text" id="username" name="username" placeholder="Digite seu usuário" required>
                    </div>
                    <div class="input-group">
                        <label for="password">Senha</label>
                        <input type="password" id="password" name="password" placeholder="Digite sua senha" required>
                    </div>
                    <div id="error-message" class="error-message"></div>
                    <button type="submit" class="login-btn">Entrar</button>
                </form>
                <div class="links-container">
                    <a href="#" class="link">Esqueceu a senha?</a>
                    <a href="#" class="link">Criar conta</a>
                </div>
            </div>
        </div>
    </main>
    <footer>
        <p>© 2025 Universo Ben 10 – Feito por um fã de sangue alienígena</p>
    </footer>

    
</body>
</html>
